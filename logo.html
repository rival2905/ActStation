<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Logo RSUD Karawang - Akurat</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #dcdcdc; 
            font-family: sans-serif;
        }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #333;
            pointer-events: none;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="info">Klik & tahan untuk memutar • Scroll untuk memperbesar</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Inisialisasi Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdedede);

        const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. Pencahayaan Studio (Mirip Render 3D)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
        keyLight.position.set(-5, 8, 10);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.bias = -0.0005;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
        fillLight.position.set(6, -5, 8);
        scene.add(fillLight);

        // 3. Material
        const greenMat = new THREE.MeshStandardMaterial({ 
            color: 0x208545, // Hijau RSUD Karawang
            roughness: 0.4, 
            metalness: 0.05 
        });

        const yellowMat = new THREE.MeshStandardMaterial({ 
            color: 0xeee000, // Kuning cerah
            roughness: 0.35, 
            metalness: 0.02 
        });

        const logoGroup = new THREE.Group();
        scene.add(logoGroup);

        // Ukuran proporsi sesuai gambar asli (rasio lebar lengan : panjang = ~1 : 2.65)
        const W = 1.48; // Setengah lebar luar hijau
        const L = 4.00; // Panjang luar hijau dari pusat
        const w = 1.08; // Setengah lebar dalam kuning
        const l = 3.60; // Panjang dalam kuning dari pusat

        // 4. Membuat Pelat Dasar Belakang (Hijau Utuh) & Isian Kuning Utuh
        function createRoundedCross(halfW, len, radius) {
            const s = new THREE.Shape();
            const r = radius;
            s.moveTo(-halfW + r, len);
            s.lineTo(halfW - r, len);
            s.quadraticCurveTo(halfW, len, halfW, len - r);
            s.lineTo(halfW, halfW);
            s.lineTo(len - r, halfW);
            s.quadraticCurveTo(len, halfW, len, halfW - r);
            s.lineTo(len, -halfW + r);
            s.quadraticCurveTo(len, -halfW, len - r, -halfW);
            s.lineTo(halfW, -halfW);
            s.lineTo(halfW, -len + r);
            s.quadraticCurveTo(halfW, -len, halfW - r, -len);
            s.lineTo(-halfW + r, -len);
            s.quadraticCurveTo(-halfW, -len, -halfW, -len + r);
            s.lineTo(-halfW, -halfW);
            s.lineTo(-len + r, -halfW);
            s.quadraticCurveTo(-len, -halfW, -len, -halfW + r);
            s.lineTo(-len, halfW - r);
            s.quadraticCurveTo(-len, halfW, -len + r, halfW);
            s.lineTo(-halfW, halfW);
            s.lineTo(-halfW, len - r);
            s.quadraticCurveTo(-halfW, len, -halfW + r, len);
            return s;
        }

        // A. Pelat Belakang Hijau
        const backPlateGeo = new THREE.ExtrudeGeometry(createRoundedCross(W, L, 0.25), {
            depth: 0.5,
            bevelEnabled: true,
            bevelSegments: 5,
            steps: 1,
            bevelSize: 0.06,
            bevelThickness: 0.06
        });
        const backPlateMesh = new THREE.Mesh(backPlateGeo, greenMat);
        backPlateMesh.position.z = -0.45;
        backPlateMesh.receiveShadow = true;
        logoGroup.add(backPlateMesh);

        // B. Lapisan Kuning di Tengah (Menyatu di pusat, sedikit lebih rendah dari bingkai hijau)
        const yellowCrossGeo = new THREE.ExtrudeGeometry(createRoundedCross(w + 0.08, l + 0.08, 0.05), {
            depth: 0.35,
            bevelEnabled: false
        });
        const yellowCrossMesh = new THREE.Mesh(yellowCrossGeo, yellowMat);
        yellowCrossMesh.position.z = -0.05; // Permukaan depan di Z = +0.30
        yellowCrossMesh.receiveShadow = true;
        logoGroup.add(yellowCrossMesh);

        // 5. Membuat 4 Segmen Bingkai Hijau + Duri Pusaran Tengah (Swirl)
        // Setiap segmen membungkus 1 lengan lalu melengkung masuk ke titik pusat (0,0)
        function createGreenSwirlSegment() {
            const s = new THREE.Shape();
            const r = 0.25; // Radius sudut luar

            // Mulai dari titik pusat (ujung runcing pusaran)
            s.moveTo(0, 0);

            // Kurva Bawah Pusaran (Cekung): melengkung naik menuju dinding dalam lengan atas (-w, 1.45)
            s.bezierCurveTo(-0.45, 0.02, -w, 0.42, -w, 1.45);

            // Naik menyusuri dinding dalam kiri lengan atas
            s.lineTo(-w, l);
            // Menyusuri batas dalam atas
            s.lineTo(w, l);
            // Turun menyusuri dinding dalam kanan lengan atas hingga titik mulai melengkung
            s.lineTo(w, 2.25);

            // Kurva Atas Pusaran: melengkung ke kanan menuju dinding dalam lengan kanan
            // (Bagian ini akan bertemu mulus dengan segmen berikutnya yang diputar 90 derajat)
            s.bezierCurveTo(w, 1.55, 1.28, w, 1.85, w);

            // Geser sedikit ke luar lalu naik ke sudut dalam luar (W, W)
            s.lineTo(1.85, W);
            s.lineTo(W, W);

            // Naik menyusuri dinding luar kanan lengan atas dengan sudut membulat
            s.lineTo(W, L - r);
            s.quadraticCurveTo(W, L, W - r, L);
            // Dinding luar paling atas
            s.lineTo(-W + r, L);
            s.quadraticCurveTo(-W, L, -W, L - r);

            // Turun menyusuri dinding luar kiri lengan atas sampai ke sudut lipatan (-W, W)
            s.lineTo(-W, W);

            // Kurva Punggung Pusaran (Cembung): dari sudut dalam (-W, W) melengkung meruncing ke pusat (0,0)
            s.bezierCurveTo(-W, 0.48, -0.68, 0.04, 0, 0);

            return s;
        }

        const segmentShape = createGreenSwirlSegment();
        const segmentGeo = new THREE.ExtrudeGeometry(segmentShape, {
            depth: 0.50, // Lebih tinggi dari kuning (0.30) sehingga tampak menonjol (embossed)
            bevelEnabled: true,
            bevelSegments: 5,
            steps: 1,
            bevelSize: 0.05,
            bevelThickness: 0.05
        });

        // Duplikasi 4 kali memutar 90 derajat untuk membentuk keempat lengan dan pusaran tengah
        for (let i = 0; i < 4; i++) {
            const segMesh = new THREE.Mesh(segmentGeo, greenMat);
            segMesh.rotation.z = i * (Math.PI / 2);
            segMesh.position.z = 0; // Permukaan depan di Z = +0.55
            segMesh.castShadow = true;
            segMesh.receiveShadow = true;
            logoGroup.add(segMesh);
        }

        // 6. Responsif & Loop Animasi
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
